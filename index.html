<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozge Qadam | Экосистема Твоего Развития</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        display: ['Unbounded', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#030712',
                            panel: '#0f172a',
                            blue: '#2563eb',
                            cyan: '#06b6d4',
                            purple: '#7c3aed'
                        }
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'grid-move': 'gridMove 20s linear infinite',
                        'pulse-glow': 'pulseGlow 2s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        gridMove: {
                            '0%': { backgroundPosition: '0 0' },
                            '100%': { backgroundPosition: '50px 50px' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 10px rgba(6, 182, 212, 0.5)' },
                            '50%': { boxShadow: '0 0 25px rgba(6, 182, 212, 0.9)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030712; color: #e2e8f0; overflow-x: hidden; }
        .bg-grid {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }
        .glass { 
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 15px 40px -10px rgba(6, 182, 212, 0.2);
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .tab-active { background: linear-gradient(90deg, #2563eb, #06b6d4); color: white; box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); }
        .tab-inactive { background: rgba(255,255,255,0.03); color: #94a3b8; border: 1px solid rgba(255,255,255,0.05); }
        .chat-bubble-bot { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-top-left-radius: 0; }
        .chat-bubble-user { background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); border-top-right-radius: 0; box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3); }

        /* Кастомный стиль для Popup, чтобы текст был виден на черном */
        .leaflet-popup-content-wrapper { 
            background: white !important; 
            color: black !important; 
            border-radius: 12px;
        }
        .leaflet-popup-tip { background: white !important; }

        /* Пульсирующий маркер пользователя */
        .user-location-marker {
            background: #2563eb;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            animation: pulse-user 2s infinite;
        }
        @keyframes pulse-user {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body class="selection:bg-cyan-500/30">

    <div class="fixed inset-0 z-[-1] bg-grid animate-grid-move"></div>

    <header class="fixed w-full top-0 z-50 bg-[#030712]/80 backdrop-blur-xl border-b border-white/5 transition-all">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="relative w-11 h-11 rounded-xl overflow-hidden shadow-[0_0_20px_rgba(6,182,212,0.4)] border border-white/10 group-hover:scale-105 transition duration-300">
                    <img src="WhatsApp Image 2026-01-23 at 22.10.17.jpeg" onerror="this.src='https://placehold.co/100x100/000/FFF?text=OQ'" alt="OQ" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col">
                    <span class="font-display font-bold text-lg tracking-wide text-white leading-none group-hover:text-cyan-400 transition">OZGE</span>
                    <span class="font-display font-bold text-xs tracking-[0.3em] text-blue-500 leading-none mt-1">QADAM</span>
                </div>
            </div>
            <nav class="hidden md:flex items-center gap-1 bg-white/5 p-1.5 rounded-full border border-white/5 backdrop-blur-md">
                <a href="#map-section" class="px-6 py-2 rounded-full text-[11px] font-bold uppercase tracking-widest text-slate-300 hover:text-white">Карта</a>
                <a href="#career" class="px-6 py-2 rounded-full text-[11px] font-bold uppercase tracking-widest text-slate-300 hover:text-white">Работа</a>
                <a href="#mentors" class="px-6 py-2 rounded-full text-[11px] font-bold uppercase tracking-widest text-slate-300 hover:text-white">Менторы</a>
            </nav>
            <button onclick="openAuthModal()" class="bg-gradient-to-r from-blue-600 to-cyan-500 text-white px-8 py-2.5 rounded-xl text-xs font-bold uppercase transition-all shadow-[0_0_25px_rgba(6,182,212,0.4)] border border-white/10">Войти</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto pt-24 pb-12 px-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <div class="lg:col-span-4 space-y-4">
            <div class="glass rounded-[2rem] sticky top-24 h-[calc(100vh-120px)] flex flex-col shadow-2xl ring-1 ring-white/10 overflow-hidden">
                <div class="p-6 bg-gradient-to-b from-slate-900/80 to-slate-900/40 border-b border-white/5 flex items-center gap-4">
                    <div class="relative">
                        <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-white/10 flex items-center justify-center text-2xl shadow-[0_0_20px_rgba(37,99,235,0.3)]">🤖</div>
                        <span class="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 rounded-full animate-pulse-glow border-2 border-[#0f172a]"></span>
                    </div>
                    <div>
                        <h2 class="font-display text-sm font-bold text-white">Ozge Assistant</h2>
                        <p class="text-[10px] text-cyan-400 font-mono mt-1">System Online • v6.0</p>
                    </div>
                </div>
                <div id="chat-window" class="flex-1 overflow-y-auto p-5 space-y-6 custom-scroll">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-sm border border-white/10">🤖</div>
                        <div class="chat-bubble-bot p-4 rounded-2xl text-slate-200 text-sm shadow-lg max-w-[90%]">
                            <p class="font-medium mb-1 text-white">Салем! 👋</p>
                            <p class="text-xs text-slate-400">Я готов помочь тебе сориентироваться в городе.</p>
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-[#02040a]/60 backdrop-blur-md border-t border-white/5">
                    <div class="relative group">
                        <input id="user-input" type="text" placeholder="Введите сообщение..." class="w-full bg-slate-900/50 border border-slate-700/50 text-slate-200 rounded-xl pl-4 pr-12 py-4 text-sm focus:outline-none focus:border-cyan-500 transition-all">
                        <button id="send-btn" class="absolute right-2 top-2.5 p-2 bg-gradient-to-br from-blue-600 to-cyan-600 rounded-lg text-white shadow-lg">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-2-9-18-9 18 9-2zm0 0v-8" /></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 space-y-8">
            <div id="map-section" class="glass rounded-[2.5rem] p-2 border-t border-cyan-500/20 relative shadow-2xl group overflow-hidden">
                <div class="absolute top-6 left-6 right-6 z-[400] flex gap-2 overflow-x-auto no-scrollbar pb-2">
                    <button onclick="filterMap('jobs')" class="whitespace-nowrap bg-slate-900/90 text-indigo-200 hover:bg-indigo-600 hover:text-white px-5 py-3 rounded-2xl text-xs font-bold border border-indigo-500/30 transition-all shadow-lg flex items-center gap-2"><span>💼</span> Работа</button>
                    <button onclick="filterMap('services')" class="whitespace-nowrap bg-slate-900/90 text-cyan-200 hover:bg-cyan-600 hover:text-white px-5 py-3 rounded-2xl text-xs font-bold border border-cyan-500/30 transition-all shadow-lg flex items-center gap-2"><span>🏛</span> ЦОНы</button>
                    <button onclick="filterMap('food')" class="whitespace-nowrap bg-slate-900/90 text-orange-200 hover:bg-orange-600 hover:text-white px-5 py-3 rounded-2xl text-xs font-bold border border-orange-500/30 transition-all shadow-lg flex items-center gap-2"><span>🍔</span> Еда</button>
                    <button onclick="filterMap('leisure')" class="whitespace-nowrap bg-slate-900/90 text-green-200 hover:bg-green-600 hover:text-white px-5 py-3 rounded-2xl text-xs font-bold border border-green-500/30 transition-all shadow-lg flex items-center gap-2"><span>🌳</span> Отдых</button>
                </div>
                
                <div id="map" class="h-[550px] w-full rounded-[2rem] bg-[#0b1221] z-0 shadow-inner"></div>

                <button onclick="locateUser()" class="absolute bottom-10 right-6 z-[400] bg-white text-slate-900 p-3 rounded-2xl shadow-2xl hover:bg-cyan-50 transition-all border border-slate-200 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </button>
            </div>

            <div id="career" class="glass rounded-[2.5rem] p-6 border border-blue-500/10">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-display text-xl font-bold text-white flex items-center gap-2">Смарт Работа <span class="h-2 w-2 bg-cyan-500 rounded-full animate-pulse"></span></h3>
                    <div class="flex bg-slate-900/60 p-1 rounded-xl">
                        <button onclick="switchJobTab('vacancies')" id="tab-vacancies" class="tab-active px-4 py-2 rounded-lg text-[10px] font-bold uppercase">Вакансии</button>
                        <button onclick="switchJobTab('internships')" id="tab-intern" class="tab-inactive px-4 py-2 rounded-lg text-[10px] font-bold uppercase ml-1">Стажировки</button>
                    </div>
                </div>
                <div id="jobs-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </main>

    <dialog id="auth-modal" class="bg-transparent backdrop:bg-[#030712]/95 backdrop:backdrop-blur-xl p-0 w-full max-w-md rounded-[2.5rem] m-auto">
        <div class="bg-[#0f172a] border border-cyan-500/20 rounded-[2.5rem] text-white p-8 relative">
            <button onclick="document.getElementById('auth-modal').close()" class="absolute top-6 right-6 text-slate-400">✕</button>
            <h2 class="text-xl font-bold mb-6">Вход в систему</h2>
            <div class="space-y-4">
                <input type="text" placeholder="Email / Телефон" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm outline-none focus:border-cyan-500">
                <input type="password" placeholder="Пароль" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm outline-none focus:border-cyan-500">
                <button class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition">Войти</button>
            </div>
        </div>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- ДАННЫЕ ---
        const mapLocations = {
            jobs: [{ lat: 43.235, lng: 76.915, title: "Ozge Media", desc: "SMM Менеджер" }, { lat: 43.240, lng: 76.905, title: "Coffee Boom", desc: "Бариста" }],
            services: [{ lat: 43.2389, lng: 76.8897, title: "ЦОН Бостандык", desc: "Ходжанова 9" }],
            food: [{ lat: 43.2355, lng: 76.9155, title: "Nedelka", desc: "Кофейня" }],
            leisure: [{ lat: 43.2560, lng: 76.9280, title: "Парк 28 Панфиловцев", desc: "История" }]
        };

        const jobsData = {
            vacancies: [{ title: 'SMM Менеджер', salary: '300 000 ₸', company: 'Ozge Media', hot: true }, { title: 'Бариста', salary: '180 000 ₸', company: 'Coffee Boom', hot: false }],
            internships: [{ title: 'Frontend Intern', salary: 'Paid', company: 'Kolesa Group', hot: true }]
        };

        // --- ИНИЦИАЛИЗАЦИЯ КАРТЫ ---
        const map = L.map('map', {zoomControl: false}).setView([43.238949, 76.889709], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        let markersLayer = L.layerGroup().addTo(map);
        let userMarker; // Переменная для маркера пользователя

        // --- ФУНКЦИИ КАРТЫ ---
        function filterMap(type) {
            markersLayer.clearLayers();
            const items = mapLocations[type] || [];
            items.forEach(item => {
                const icon = L.divIcon({ className: 'bg-transparent', html: `<div class="w-8 h-8 rounded-full bg-blue-600 border-2 border-white flex items-center justify-center shadow-lg">📍</div>` });
                L.marker([item.lat, item.lng], {icon}).bindPopup(`<div style="color:black"><b>${item.title}</b><br>${item.desc}</div>`).addTo(markersLayer);
            });
            if(items.length > 0) map.fitBounds(new L.featureGroup(markersLayer.getLayers()).getBounds().pad(0.2));
        }

        // --- ГЕОЛОКАЦИЯ (ИСПРАВЛЕННАЯ) ---
        function locateUser() {
            if (!navigator.geolocation) return alert("Браузер не поддерживает геолокацию");
            
            const options = { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 };

            navigator.geolocation.getCurrentPosition((pos) => {
                const { latitude, longitude } = pos.coords;
                if (userMarker) map.removeLayer(userMarker); // Удаляем старый маркер

                map.flyTo([latitude, longitude], 16);
                
                const userIcon = L.divIcon({ className: 'user-location-marker', iconSize: [18, 18] });
                userMarker = L.marker([latitude, longitude], { icon: userIcon }).addTo(map);
                
                // Исправленный Popup с белым фоном для читаемости
                userMarker.bindPopup(`<div style="color: black; padding: 5px;"><b>Вы здесь</b></div>`).openPopup();
            }, () => alert("Не удалось найти вас на карте. Проверьте GPS."), options);
        }

        // --- ДОП. ФУНКЦИИ ---
        function switchJobTab(type) {
            renderJobs(type);
            document.getElementById('tab-vacancies').className = type === 'vacancies' ? 'tab-active px-4 py-2 rounded-lg text-[10px] font-bold uppercase' : 'tab-inactive px-4 py-2 rounded-lg text-[10px] font-bold uppercase';
            document.getElementById('tab-intern').className = type === 'internships' ? 'tab-active px-4 py-2 rounded-lg text-[10px] font-bold uppercase ml-1' : 'tab-inactive px-4 py-2 rounded-lg text-[10px] font-bold uppercase ml-1';
        }

        function renderJobs(type) {
            const container = document.getElementById('jobs-container');
            container.innerHTML = (jobsData[type] || []).map(job => `
                <div class="glass-card p-4 rounded-2xl relative">
                    ${job.hot ? '<span class="absolute top-2 right-2 text-[8px] bg-red-500 text-white px-2 py-0.5 rounded-full">HOT</span>' : ''}
                    <h4 class="text-white font-bold text-sm">${job.title}</h4>
                    <p class="text-xs text-green-400 font-bold mt-1">${job.salary}</p>
                    <p class="text-[10px] text-slate-400 mt-1">${job.company}</p>
                </div>
            `).join('');
        }

        function openAuthModal() { document.getElementById('auth-modal').showModal(); }

        window.onload = () => {
            renderJobs('vacancies');
            filterMap('jobs');
            locateUser(); // Авто-поиск при входе
        };

        // Простая отправка сообщений
        document.getElementById('send-btn').onclick = () => {
            const input = document.getElementById('user-input');
            if(!input.value) return;
            document.getElementById('chat-window').innerHTML += `<div class="flex justify-end"><div class="chat-bubble-user p-3 rounded-2xl text-sm text-white">${input.value}</div></div>`;
            input.value = '';
        };
    </script>
</body>
</html>
